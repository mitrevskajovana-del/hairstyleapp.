<!DOCTYPE html>
<html>
<head>
    <title>Book Appointment</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
    <h1>Book Appointment 💇‍♀️</h1>
</header>

<div class="form-container">

    <form>

        <label>Choose Hair Salon:</label><br>
        <select>
            <option>Beauty Salon Luxe</option>
            <option>Hair Studio Glam</option>
            <option>Style Bar Skopje</option>
        </select><br><br>

        <label>Choose Hair Stylist:</label><br>
        <select>
            <option>Marija (Wedding specialist)</option>
            <option>Ana (Color expert)</option>
            <option>Elena (Casual styles)</option>
        </select><br><br>

        <label>Choose Hairstyle:</label><br>
        <select>
            <option>Wedding Hairstyle</option>
            <option>Casual Style</option>
            <option>Hair Coloring</option>
        </select><br><br>

        <label>Select Date:</label><br>
        <input type="date"><br><br>

        <label>Select Time:</label><br>
        <input type="time"><br><br>

        <button type="submit">Book Appointment</button>

    </form>

</div>

</body>
</html>
